<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="https://cdn-icons-png.freepik.com/128/1950/1950715.png">
    <title>Todo App</title>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
      import {
        getFirestore,
        collection,
        addDoc,
        getDocs,
        deleteDoc,
        setDoc,
        doc,
        updateDoc,
      } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDkt_SNSr4N6o_s-rBY263O5vHUjE8YXLE",
        authDomain: "todo-app-2be31.firebaseapp.com",
        projectId: "todo-app-2be31",
        storageBucket: "todo-app-2be31.firebasestorage.app",
        messagingSenderId: "1024215843740",
        appId: "1:1024215843740:web:3325aa8b3de5d11822fe59",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      window.db = db;
      window.firestoreTools = {
        collection,
        addDoc,
        setDoc,
        getDocs,
        deleteDoc,
        doc,
        updateDoc,
      };
    </script>
    <script type="text/javascript" src="./script.js" defer=""></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <div id="confirmModal" class="modal">
      <div class="modal-content">
        <p>Are you sure you want to delete this task?</p>
        <button id="confirmYes">Yes</button>
        <button id="confirmNo">No</button>
      </div>
    </div>
    <div class="container">
      <h1>Todo List</h1>
      <div class="input">
        <input type="text" id="input-box" placeholder="Add your Text" />
        <input id="date" type="date" /> <input id="time" type="time" />
        <button onclick="addtask()">Add</button>
      </div>
      <ul class="output"></ul>
    </div>
    <noscript>
      <style>
        body > *:not(noscript) {
          display: none !important;
        }

        body {
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          margin: 0;
          background: #f9f9f9;
          font-family: Arial, sans-serif;
        }
      </style>
      <div>
        <h2>This app requires JavaScript to function.</h2>
        <p>Please enable JavaScript in your browser and reload the page.</p>
      </div>
    </noscript>
  </body>
</html>
